<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Priya, virtual assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6EE"/>
      <stop offset="1" stop-color="#BFE3CB"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D59B76"/>
      <stop offset="1" stop-color="#C4875F"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A231C"/>
      <stop offset="1" stop-color="#1E120E"/>
    </linearGradient>
    <clipPath id="c"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="120" height="120" fill="url(#bg)"/>

    <!-- long hair behind the shoulders -->
    <path d="M31 58 C28 30 44 17 60 17 C77 17 93 29 90 58 C91 76 95 92 101 108 L19 108 C25 92 29 76 31 58Z" fill="url(#hair)"/>

    <!-- neck -->
    <path d="M52 76 H68 V91 C64 95 56 95 52 91Z" fill="#B87A56"/>

    <!-- blazer and blouse -->
    <path d="M16 120 C18 100 33 90 51 87 L60 101 L69 87 C87 90 102 100 104 120Z" fill="#0B2C18"/>
    <path d="M51 87 L60 101 L69 87 L65 86 L60 95 L55 86Z" fill="#FFFFFF"/>
    <path d="M51 87 L47 92 L58 113 L60 101Z" fill="#12863F"/>
    <path d="M69 87 L73 92 L62 113 L60 101Z" fill="#12863F"/>
    <circle cx="74" cy="103" r="2.2" fill="#F6E005"/>

    <!-- face -->
    <ellipse cx="60" cy="55" rx="21" ry="25" fill="url(#skin)"/>

    <!-- side-swept fringe -->
    <path d="M38 53 C37 35 49 27 62 28 C75 29 85 38 82 55 C78 45 69 38 58 38 C49 39 42 45 38 53Z" fill="url(#hair)"/>
    <path d="M58 30 C66 31 74 35 78 42" stroke="#5A382C" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".6"/>

    <!-- brows -->
    <path d="M46.5 50.5 Q51.5 48 56 50" stroke="#2A1A15" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <path d="M64 50 Q68.5 48 73.5 50.5" stroke="#2A1A15" stroke-width="1.7" fill="none" stroke-linecap="round"/>

    <!-- eyes with lashes and highlights -->
    <ellipse cx="51.5" cy="56.5" rx="2.6" ry="2.9" fill="#2A1A15"/>
    <ellipse cx="68.5" cy="56.5" rx="2.6" ry="2.9" fill="#2A1A15"/>
    <circle cx="52.3" cy="55.6" r=".8" fill="#fff"/>
    <circle cx="69.3" cy="55.6" r=".8" fill="#fff"/>
    <path d="M48.3 54.8 Q51.5 52.6 54.8 54.6" stroke="#2A1A15" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M65.2 54.6 Q68.5 52.6 71.7 54.8" stroke="#2A1A15" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <!-- bindi, nose, cheeks, smile -->
    <circle cx="60" cy="48.6" r="1.2" fill="#A83A4B"/>
    <path d="M59.2 61.8 Q60 64.4 61.6 63.6" stroke="#9A5E43" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <circle cx="46.5" cy="63.5" r="3.6" fill="#E48C7A" opacity=".35"/>
    <circle cx="73.5" cy="63.5" r="3.6" fill="#E48C7A" opacity=".35"/>
    <path d="M53.5 69 Q60 75.5 66.5 69 Q60 71.8 53.5 69Z" fill="#fff" stroke="#A83A4B" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- earring on the visible ear -->
    <circle cx="81.5" cy="65" r="1.7" fill="#E2B94B"/>

    <!-- headset -->
    <path d="M36 57 C35 25 85 25 84 57" stroke="#1C2621" stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <rect x="31.5" y="51" width="8.5" height="14" rx="4" fill="#1C2621"/>
    <rect x="33" y="53" width="3" height="10" rx="1.5" fill="#12863F"/>
    <path d="M36.5 64 C38 74 44 77 50.5 75.5" stroke="#1C2621" stroke-width="2.1" fill="none" stroke-linecap="round"/>
    <circle cx="51.5" cy="75.2" r="2.5" fill="#12863F"/>
  </g>
</svg>
